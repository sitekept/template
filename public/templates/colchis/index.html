<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<base href="/colchis/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colchis</title>
<meta name="description" content="Buy an apartment in Tbilisi, Batumi or Gudauri with a team that handles everything: selection, yield analysis, flights, airport pickup, bank account and registration.">
<meta name="theme-color" content="#f3efe7">
<meta property="og:title" content="Colchis — Real estate in Georgia">
<meta property="og:image" content="assets/img/hero-tbilisi.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='0' fill='%231b1814'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' text-anchor='middle' fill='%23f3efe7'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Frank+Ruhl+Libre:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
<script>(function(){var L=['he','ru','en','ka'],l=new URLSearchParams(location.search).get('lang');try{l=l||localStorage.getItem('colchis-lang')}catch(e){}l=l||(navigator.language||'').slice(0,2);if(L.indexOf(l)<0)l='he';var h=document.documentElement;h.lang=l;h.dir=l==='he'?'rtl':'ltr'})();</script>
</head>
<body data-page="home" data-meta="meta.home.title" >
<div id="chrome-top"></div>
<main>
<section class="hero">
  <div class="hero-frame">
    <div class="hero-media"><img src="assets/img/hero-tbilisi.jpg" srcset="assets/img/hero-tbilisi-sm.jpg 900w, assets/img/hero-tbilisi.jpg 1800w" sizes="100vw" alt="" fetchpriority="high"></div>
    <div class="hero-inner">
      <div>
        <span class="eyebrow on-night" style="background:rgba(255,255,255,.08);color:rgba(239,233,221,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)" data-i18n="home.hero.eyebrow"></span>
        <h1 class="display h-hero" data-i18n="home.hero.title"></h1>
        <p class="lead" data-i18n="home.hero.lead"></p>
        <div class="hero-ctas">
          <a class="btn btn-light" href="listings.html"><span data-i18n="cta.viewAll"></span><span class="chip"><svg class="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a>
          <a class="btn btn-ghost on-dark btn-wa" data-wa href="#"><span data-i18n="cta.whatsapp"></span><span class="chip"></span></a>
        </div>
      </div>
      <a class="hero-card" id="hero-card" href="property.html?id=1" aria-label="Featured property"></a>
    </div>
  </div>
</section>

<section class="wrap" aria-label="Key figures">
  <div class="stats num">
    <div class="stat reveal"><span class="stat-v">7–13%</span><span class="stat-l" data-i18n="home.stats.yield"></span></div>
    <div class="stat reveal" style="--d:.06s"><span class="stat-v" data-i18n="home.stats.registrationValue"></span><span class="stat-l" data-i18n="home.stats.registration"></span></div>
    <div class="stat reveal" style="--d:.12s"><span class="stat-v" data-i18n="home.stats.flightValue"></span><span class="stat-l" data-i18n="home.stats.flight"></span></div>
    <div class="stat reveal" style="--d:.18s"><span class="stat-v" data-i18n="home.stats.restrictionsValue"></span><span class="stat-l" data-i18n="home.stats.restrictions"></span></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow reveal" data-i18n="home.markets.eyebrow"></span><h2 class="h-1 reveal" data-i18n="home.markets.title"></h2></div>
      <p class="lead reveal" data-i18n="home.markets.lead"></p>
    </div>
    <div class="markets">
      <a class="market market-1 reveal" href="listings.html?city=tbilisi"><img src="assets/img/narikala.jpg" srcset="assets/img/narikala-sm.jpg 900w, assets/img/narikala.jpg 1800w" sizes="(max-width:860px) 100vw, 60vw" alt="" loading="lazy"><span class="tag" data-i18n="market.tbilisi.tag"></span><h3 data-i18n="market.tbilisi.name"></h3><p data-i18n="market.tbilisi.text"></p></a>
      <a class="market market-2 reveal" style="--d:.08s" href="listings.html?city=batumi"><img src="assets/img/batumi-bay-sm.jpg" alt="" loading="lazy"><span class="tag" data-i18n="market.batumi.tag"></span><h3 data-i18n="market.batumi.name"></h3><p data-i18n="market.batumi.text"></p></a>
      <a class="market market-3 reveal" style="--d:.14s" href="listings.html?city=gudauri"><img src="assets/img/p-gudauri-sm.jpg" alt="" loading="lazy"><span class="tag" data-i18n="market.gudauri.tag"></span><h3 data-i18n="market.gudauri.name"></h3><p data-i18n="market.gudauri.text"></p></a>
      <a class="market market-4 reveal" href="listings.html?city=sighnaghi"><img src="assets/img/p-sighnaghi.jpg" srcset="assets/img/p-sighnaghi-sm.jpg 900w, assets/img/p-sighnaghi.jpg 1800w" sizes="100vw" alt="" loading="lazy"><span class="tag" data-i18n="market.kakheti.tag"></span><h3 data-i18n="market.kakheti.name"></h3><p data-i18n="market.kakheti.text"></p></a>
    </div>
  </div>
</section>

<section class="section on-paper-2">
  <div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow reveal" data-i18n="home.featured.eyebrow"></span><h2 class="h-1 reveal" data-i18n="home.featured.title"></h2></div>
      <div class="reveal" style="justify-self:end"><p class="lead" data-i18n="home.featured.lead"></p><p style="margin-top:1.6rem"><a class="btn btn-ghost" href="listings.html"><span data-i18n="cta.viewAll"></span><span class="chip"><svg class="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a></p></div>
    </div>
    <div class="grid-props" id="featured"></div>
  </div>
</section>

<section class="section on-night" id="calc">
  <div class="wrap calc">
    <div>
      <span class="eyebrow reveal" data-i18n="calc.eyebrow"></span>
      <h2 class="h-1 reveal" data-i18n="calc.title"></h2>
      <p class="lead reveal" style="margin:1.6rem 0 2.5rem" data-i18n="calc.lead"></p>
      <div class="calc-controls bezel reveal"><div class="core">
        <div class="range-row"><label for="c-price"><span data-i18n="calc.price"></span><output id="o-price" class="num"></output></label><input type="range" id="c-price" min="30000" max="500000" step="1000" value="85000"></div>
        <div class="range-row"><label for="c-rent"><span data-i18n="calc.rent"></span><output id="o-rent" class="num"></output></label><input type="range" id="c-rent" min="200" max="4000" step="10" value="750"></div>
        <div class="range-row"><label for="c-occ"><span data-i18n="calc.occupancy"></span><output id="o-occ" class="num"></output></label><input type="range" id="c-occ" min="40" max="100" step="1" value="85"></div>
        <div class="range-row"><label for="c-cost"><span data-i18n="calc.costs"></span><output id="o-cost" class="num"></output></label><input type="range" id="c-cost" min="0" max="35" step="1" value="18"></div>
      </div></div>
    </div>
    <div class="reveal" style="--d:.1s;align-self:end">
      <dl class="calc-out num">
        <div><dt data-i18n="calc.gross"></dt><dd id="r-gross"></dd></div>
        <div class="big"><dt data-i18n="calc.net"></dt><dd id="r-net"></dd></div>
        <div><dt data-i18n="calc.annual"></dt><dd id="r-annual"></dd></div>
        <div><dt data-i18n="calc.payback"></dt><dd id="r-payback" style="font-size:clamp(2rem,3.4vw,2.8rem)"></dd></div>
      </dl>
      <p class="calc-note" data-i18n="calc.note"></p>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow reveal" data-i18n="home.services.eyebrow"></span><h2 class="h-1 reveal" data-i18n="home.services.title"></h2></div>
      <div class="reveal" style="justify-self:end"><p class="lead" data-i18n="home.services.lead"></p><p style="margin-top:1.6rem"><a class="btn btn-ghost" href="services.html"><span data-i18n="nav.services"></span><span class="chip"><svg class="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a></p></div>
    </div>
    <div class="svc-grid" id="svc-grid"></div>
  </div>
</section>

<section class="section on-paper-2">
  <div class="wrap">
    <span class="eyebrow reveal" data-i18n="home.process.eyebrow"></span>
    <h2 class="h-1 reveal" style="margin-bottom:clamp(3rem,6vw,5rem);max-width:14ch" data-i18n="home.process.title"></h2>
    <ol class="steps" style="list-style:none;padding:0;margin:0">
      <li class="step reveal"><span class="step-n num">01</span><h3 data-i18n="step.1.title"></h3><p data-i18n="step.1.text"></p></li>
      <li class="step reveal" style="--d:.08s"><span class="step-n num">02</span><h3 data-i18n="step.2.title"></h3><p data-i18n="step.2.text"></p></li>
      <li class="step reveal" style="--d:.16s"><span class="step-n num">03</span><h3 data-i18n="step.3.title"></h3><p data-i18n="step.3.text"></p></li>
      <li class="step reveal" style="--d:.24s"><span class="step-n num">04</span><h3 data-i18n="step.4.title"></h3><p data-i18n="step.4.text"></p></li>
    </ol>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow reveal" data-i18n="home.journal.eyebrow"></span><h2 class="h-1 reveal" data-i18n="home.journal.title"></h2></div>
      <p class="reveal" style="justify-self:end"><a class="btn btn-ghost" href="blog.html"><span data-i18n="cta.allArticles"></span><span class="chip"><svg class="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a></p>
    </div>
    <div class="journal-grid" id="journal-grid"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="wrap faq-layout">
    <div class="sticky">
      <span class="eyebrow reveal" data-i18n="home.faq.eyebrow"></span>
      <h2 class="h-1 reveal" data-i18n="home.faq.title"></h2>
      <p class="reveal" style="margin-top:2rem"><a class="btn btn-ghost" href="faq.html"><span data-i18n="cta.allQuestions"></span><span class="chip"><svg class="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a></p>
    </div>
    <div class="faq-list reveal" id="faq-teaser"></div>
  </div>
</section>
</main>
<div id="chrome-bottom"></div>
<script src="assets/i18n/en.js"></script>
<script src="assets/i18n/he.js"></script>
<script src="assets/i18n/ru.js"></script>
<script src="assets/i18n/ka.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/blog-data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

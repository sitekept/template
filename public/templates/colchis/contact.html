<script>(function(){var L=['he','ru','en','ka'],l=new URLSearchParams(location.search).get('lang');try{l=l||localStorage.getItem('colchis-lang')}catch(e){}l=l||(navigator.language||'').slice(0,2);if(L.indexOf(l)<0)l='he';var h=document.documentElement;h.lang=l;h.dir=l==='he'?'rtl':'ltr'})();</script>
</head>
<body data-page="contact" data-meta="meta.contact.title" data-band="off">
<div id="chrome-top"></div>
<main><section class="page-head"><div class="wrap page-head-split">
  <div><span class="eyebrow reveal" data-i18n="contact.eyebrow"></span><h1 class="h-1 reveal" style="--d:.05s" data-i18n="contact.title"></h1></div>
  <div class="reveal" style="--d:.12s"><p class="lead" data-i18n="contact.lead"></p></div>
</div></section>
<section class="section-tight" style="padding-top:0;padding-bottom:var(--section)">
  <div class="wrap contact-layout">
    <form class="form bezel reveal" id="contact-form" novalidate><div class="core">
      <div class="form-grid">
        <label class="input"><span data-i18n="contact.form.name"></span><input name="name" autocomplete="name" required></label>
        <label class="input"><span data-i18n="contact.form.phone"></span><input name="phone" type="tel" autocomplete="tel" dir="ltr" required></label>
        <label class="input"><span data-i18n="contact.form.email"></span><input name="email" type="email" autocomplete="email" dir="ltr"></label>
        <label class="input"><span data-i18n="contact.form.lang"></span><select name="lang"></select></label>
        <label class="input"><span data-i18n="contact.form.interest"></span><select name="interest">
          <option data-i18n="contact.form.interest.invest"></option><option data-i18n="contact.form.interest.home"></option>
          <option data-i18n="contact.form.interest.both"></option><option data-i18n="contact.form.interest.services"></option></select></label>
        <label class="input"><span data-i18n="contact.form.budget"></span><select name="budget" class="num">
          <option>$40,000 – $80,000</option><option>$80,000 – $150,000</option><option>$150,000 – $300,000</option><option>$300,000+</option></select></label>
        <label class="input full"><span data-i18n="contact.form.message"></span><textarea name="message" rows="4" data-i18n-attr="placeholder:contact.form.messagePh"></textarea></label>
      </div>
      <div class="form-foot">
        <small data-i18n="contact.form.privacy"></small>
        <button class="btn btn-accent" type="submit"><span data-i18n="contact.form.submit"></span><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="i-arrow" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></button>
      </div>
      <p class="form-msg" role="status" aria-live="polite"></p>
    </div></form>
    <aside class="reveal" style="--d:.1s">
      <span class="eyebrow" data-i18n="contact.direct"></span>
      <div class="direct" id="direct"></div>
    </aside>
  </div>
</section>
</main>
<div id="chrome-bottom"></div>
<script src="assets/i18n/en.js"></script>
<script src="assets/i18n/he.js"></script>
<script src="assets/i18n/ru.js"></script>
<script src="assets/i18n/ka.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/blog-data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
